[package]
name = "lydian"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lydian"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
audiotags = "0.5.0"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
colored = "3.1.1"
config = { version = "0.15.23", default-features = false, features = ["toml"] }
env_logger = "0.11.10"
futures = "0.3.32"
ipnetwork = { version = "0.21.1", features = ["serde"] }
is_empty = "0.3.0"
log = "0.4.31"
md5 = "0.8.0"
mime-type = "0.2.0"
moka = { version = "0.12.15", features = ["future"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
rand = "0.10.1"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["brotli", "gzip", "json", "query", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
serde_urlencoded = "0.7.1"
serde_with = "3.21.0"
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite"] }
unicode-normalization = "0.1.25"
thiserror = "2.0.18"
tikv-jemallocator = { version = "0.7.0", optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal"] }
tokio-util = "0.7.18"
tower = { version = "0.5.3", features = ["tokio", "log", "limit"] }
tower-http = { version = "0.6.11", features = ["cors", "fs", "compression-gzip"] }
tower-real-ip = "0.1.0"
url = "2.5.8"

[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
debug = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
#panic = "abort"
strip = "symbols"

[features]
default = ["jemalloc"]
jemalloc = ["tikv-jemallocator"]
