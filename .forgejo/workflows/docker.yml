name: Build docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed

jobs:
  clippy:
      runs-on: ubuntu-latest
      steps:
        - uses: https://github.com/actions/checkout@v7
        - uses: https://github.com/dtolnay/rust-toolchain@nightly
          with:
            components: clippy
        - uses: https://github.com/Swatinem/rust-cache@v2
        - name: Run Clippy
          run: cargo clippy --all-targets -- -D warnings -W clippy::nursery

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --check

  build:
    needs: [clippy, rustfmt]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v7
      - name: Login to registry
        run: |
          echo "${{ secrets.WORKFLOW_AUTHTOKEN }}" | docker login ${{ vars.REGISTRY_URL }} -u ${{ github.repository_owner }} --password-stdin
      - name: Build image
        run: |
          IMAGE_BASE="${{ vars.REGISTRY_URL }}/${{ github.repository }}"
          docker build \
          -t ${IMAGE_BASE}:${{ github.sha }} \
          -t ${IMAGE_BASE}:latest \
          .

          echo "IMAGE_NAME=${IMAGE_BASE}" >> $GITHUB_ENV
      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "Docker image pushed: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
